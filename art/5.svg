<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 46 480 500" width="480" height="500" role="img" aria-label="Doodle face holding out a pinky promise">
  <rect width="600" height="600" fill="#fff8f1"/>

  <!-- head -->
  <path d="M300 74c104 0 168 66 168 168 0 78-38 140-92 170-24 13-49 19-76 19s-52-6-76-19c-54-30-92-92-92-170C132 140 196 74 300 74Z"
        fill="#fff" stroke="#241d1a" stroke-width="9" stroke-linejoin="round"/>

  <!-- blush -->
  <g fill="#ff9fb2" opacity=".5">
    <ellipse cx="196" cy="308" rx="44" ry="24"/>
    <ellipse cx="404" cy="308" rx="44" ry="24"/>
  </g>
  <g stroke="#ff6b8d" stroke-width="4.5" stroke-linecap="round" opacity=".5">
    <path d="M176 299l13 19M193 296l13 19M210 294l13 19"/>
    <path d="M377 294l13 19M394 296l13 19M411 299l13 19"/>
  </g>

  <!-- eyes -->
  <g fill="#241d1a">
    <ellipse cx="240" cy="246" rx="21" ry="27"/>
    <ellipse cx="360" cy="246" rx="21" ry="27"/>
  </g>
  <g fill="#fff">
    <circle cx="246" cy="236" r="7"/>
    <circle cx="366" cy="236" r="7"/>
  </g>

  <!-- smile -->
  <path d="M264 300c10 16 24 24 36 24s26-8 36-24" fill="none" stroke="#241d1a"
        stroke-width="8" stroke-linecap="round"/>

  <!-- pinky promise -->
  <g stroke="#241d1a" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M232 420c-18 26-26 46-22 62 4 15 22 20 38 10"/>
    <path d="M368 420c18 26 26 46 22 62-4 15-22 20-38 10"/>
  </g>
  <g stroke="#241d1a" stroke-width="8" stroke-linecap="round">
    <path d="M248 488c-8 12-8 22 2 28 12 7 26-2 32-16" fill="none"/>
    <path d="M352 488c8 12 8 22-2 28-12 7-26-2-32-16" fill="none"/>
  </g>
  <path d="M274 486c9-12 43-12 52 0 6 8-1 20-13 20-9 0-13-4-13-4s-4 4-13 4c-12 0-19-12-13-20Z"
