  <!-- hearts -->
  <g fill="#ff7d98">
    <path d="M470 132c0-14 22-20 28-6 6-14 28-8 28 6 0 18-28 34-28 34s-28-16-28-34Z"/>
    <path d="M96 176c0-11 17-15 21-5 4-10 21-6 21 5 0 13-21 25-21 25s-21-12-21-25Z" opacity=".8"/>
  </g>

  <!-- sparkles -->
  <g stroke="#ffb08a" stroke-width="6" stroke-linecap="round">
    <path d="M142 330v26M129 343h26"/>
    <path d="M472 366v22M461 377h22"/>
